<!doctype html>
<html class="no-js" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tclock</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      crossorigin="anonymous"
    ></script>
    <!-- Compressed CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css"
      crossorigin="anonymous"
    />

    <!-- Compressed JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/js/foundation.min.js"
      crossorigin="anonymous"
    ></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="stopwatch.css" />
  </head>
  <body>
    <div id="stage">
      <div class="container" id="container">
        <br />
        <div class="circle">
          <span class="time" id="display">00:00:00:00</span>

          <div class="controls">
            <button class="buttonPlay">
              <span id="playButton" class="material-symbols-outlined">
                play_circle
              </span>
              <span id="pauseButton" class="material-symbols-outlined">
                pause_circle
              </span>
            </button>

            <button class="buttonReset">
              <span id="resetButton" class="material-symbols-outlined">
                restart_alt
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="zoom.js"></script>
    <script src="nav.js"></script>
    <script>
      $(document).foundation();
    </script>
    <script src="fullscreen.button.js"></script>
    <script src="stopwatch.js"></script>
  </body>
</html>
