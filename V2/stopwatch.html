<!doctype html>
<html class="no-js" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TClock</title>
    <script src="./js/lib/jquery.min.js"></script>
    <link rel="stylesheet" href="./css/lib/foundation.min.css" />
    <script src="./js/lib/foundation.min.js"></script>
    <link rel="stylesheet" href="./css/stopwatch.css" />
    <link rel="stylesheet" href="./css/shared/footer.css" />
  </head>
  <body>
    <div id="stage">
      <div class="container" id="container">
        <br />
        <div class="circle">
          <span class="time" id="display">00:00:00:00</span>

          <div class="controls">
            <button id="playButton" class="ctlBtn">
              <img
                src="./icons/play_circle.svg"
                alt="Play"
                width="48"
                height="48"
              />
            </button>
            <button id="pauseButton" class="ctlBtn" style="display: none">
              <img
                src="./icons/pause_circle.svg"
                alt="Pause"
                width="48"
                height="48"
              />
            </button>

            <button id="resetButton" class="ctlBtn">
              <img
                src="./icons/restart_alt.svg"
                alt="Restart"
                width="48"
                height="48"
              />
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/shared/zoom.js"></script>
    <script src="./js/shared/nav.js"></script>
    <script>
      $(document).foundation();
    </script>
    <script src="./js/shared/fullscreen.button.js"></script>
    <script src="./js/stopwatch.js"></script>
  </body>
</html>
