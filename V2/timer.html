<!doctype html>
<html class="no-js" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TClock</title>
    <script src="./js/lib/jquery.min.js"></script>
    <link rel="stylesheet" href="./css/lib/foundation.min.css" />
    <script src="./js/lib/foundation.min.js"></script>
    <link rel="stylesheet" href="./css/timer.css" />
    <link rel="stylesheet" href="./css/shared/footer.css" />
  </head>

  <body>
    <div id="stage">
      <div class="container" id="container">
        <br />

        <div id="timer"></div>

        <div id="controls">
          <details id="timer-controls" open>
            <summary>
              <img src="./icons/menu.svg" alt="menu" width="24" height="24" />
            </summary>
            <div class="grid-x grid-margin-x align-middle">
              <div class="cell auto">
                <button id="start-timer" class="button">
                  <img
                    src="./icons/play_circle.svg"
                    alt="play"
                    width="24"
                    height="24"
                  />
                </button>
              </div>
              <div class="cell auto">
                <button id="pause-timer" class="button">
                  <img
                    src="./icons/pause_circle.svg"
                    alt="pause"
                    width="24"
                    height="24"
                  />
                </button>
              </div>
              <div class="cell auto">
                <button id="reset-timer" class="button">
                  <img
                    src="./icons/restart_alt.svg"
                    alt="restart"
                    width="24"
                    height="24"
                  />
                </button>
              </div>
            </div>
          </details>

          <details id="timer-settings">
            <summary>
              <img
                src="./icons/settings_applications.svg"
                alt="Settings"
                width="24"
                height="24"
              />
            </summary>

            <div class="grid-x grid-margin-x align-middle">
              <div class="cell auto">
                <label>시</label>
                <div class="input-group">
                  <input
                    type="button"
                    class="button alert adjust-time"
                    value="-"
                    data-unit="hour"
                    data-action="minus"
                  />
                  <input
                    id="hours-input"
                    class="input-group-field"
                    type="number"
                    min="0"
                    value="0"
                  />
                  <input
                    type="button"
                    class="button success adjust-time"
                    value="+"
                    data-unit="hour"
                    data-action="plus"
                  />
                </div>
              </div>

              <div class="cell auto">
                <label>분</label>
                <div class="input-group">
                  <input
                    type="button"
                    class="button alert adjust-time"
                    value="-"
                    data-unit="minute"
                    data-action="minus"
                  />
                  <input
                    id="minutes-input"
                    class="input-group-field"
                    type="number"
                    min="0"
                    value="0"
                  />
                  <input
                    type="button"
                    class="button success adjust-time"
                    value="+"
                    data-unit="minute"
                    data-action="plus"
                  />
                </div>
              </div>

              <div class="cell auto">
                <label>초</label>
                <div class="input-group">
                  <input
                    type="button"
                    class="button alert adjust-time"
                    value="-"
                    data-unit="second"
                    data-action="minus"
                  />
                  <input
                    id="seconds-input"
                    class="input-group-field"
                    type="number"
                    min="0"
                    value="0"
                  />
                  <input
                    type="button"
                    class="button success adjust-time"
                    value="+"
                    data-unit="second"
                    data-action="plus"
                  />
                </div>
              </div>
            </div>
          </details>
        </div>
      </div>
    </div>
    <footer class="copyright">
      <div class="meta">
        <img
          src="https://gongu.copyright.or.kr/static/gongu/img/common/img_license21.png"
          alt="CC BY"
          class="cc"
        />

        <img
          id="wrtImg"
          src="https://gongu.copyright.or.kr/gongu/wrt/cmmn/wrtFileImageView.do?wrtSn=13254501&amp;filePath=L2Rpc2sxL25ld2RhdGEvMjAyMC8yMS9DTFMxMDAwMi8xMzI1NDUwMV9XUlRfMjAyMDAyMDhfMQ==&amp;thumbAt=Y&amp;thumbSe=b_tbumb&amp;wrtTy=10002"
          alt="전자시계 알람"
          class="thumb"
        />

        <div class="text">
          <div class="title">전자시계 알람</div>
          <div class="details">
            by <a href="http://uci.or.kr/G905-13254501">김용배</a> —
            <a href="https://gongu.copyright.or.kr/gongu/main/main.do"
              >공유마당 저작권 위원회</a
            >
          </div>
        </div>
      </div>
    </footer>

    <script src="./js/shared/zoom.js"></script>
    <script src="./js/shared/nav.js"></script>
    <script>
      $(document).foundation();
    </script>
    <script src="./js/shared/fullscreen.button.js"></script>
    <script src="./js/timer.js"></script>
  </body>
</html>
