<!doctype html>
<html class="no-js" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TClock</title>
    <script src="./js/lib/jquery.min.js"></script>
    <link rel="stylesheet" href="./css/lib/foundation.min.css" />
    <script src="./js/lib/foundation.min.js"></script>
    <link rel="stylesheet" href="./css/index.css" />
    <link rel="stylesheet" href="./css/alarm.css" />          
    <link rel="stylesheet" href="./css/shared/footer.css" />      
  </head>
  <body>
    <div id="stage">
      <br />
      <div class="grid-container container" id="container">
        <div class="grid-x grid-padding-x align-center">
          <div class="cell small-12 text-center">
            <p id="time" class="time h1"></p>
            <p id="date" class="date h4"></p>
          </div>

          <details id="alarm-settings">
            <summary>
              <img
                src="./icons/settings_applications.svg"
                alt="Settings"
                width="24"
                height="24"
              />
            </summary>

          <div class="cell small-10 medium-8 large-6">
            <form>
              <div class="grid-x grid-margin-x align-middle content">
                <div class="cell small-4">
                  <label class="show-for-sr">시</label>
                  <select id="hour-select" aria-label="시">
                    <option value="" selected disabled hidden>시</option>
                  </select>
                </div>

                <div class="cell small-4">
                  <label class="show-for-sr">분</label>
                  <select id="minute-select" aria-label="분">
                    <option value="" selected disabled hidden>분</option>
                  </select>
                </div>

                <div class="cell small-4">
                  <label class="show-for-sr">오전/오후</label>
                  <select id="ampm-select" aria-label="오전/오후">
                    <option value="" selected disabled hidden>오전/오후</option>
                    <option value="오전">오전</option>
                    <option value="오후">오후</option>
                  </select>
                </div>
              </div>

              <div class="grid-x grid-margin-x align-center">
                <div class="cell shrink">
                  <button
                    type="button"
                    class="button primary"
                    id="set-alarm"
                    disabled
                  >
                    알림 설정
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
          </details>

        <div
          class="reveal"
          id="alarmFinished"
          data-close-on-click="false"
          data-reveal
        >
          <h1 id="alarmMessage"></h1>
          <button class="button alert" id="stopAlarm">알람 끄기</button>
        </div>
      </div>
    </div>
    <footer class="copyright">
      <div class="meta">
        <img
          src="https://gongu.copyright.or.kr/static/gongu/img/common/img_license21.png"
          alt="CC BY"
          class="cc"
        />

        <img
          id="wrtImg"
          src="https://gongu.copyright.or.kr/gongu/wrt/cmmn/wrtFileImageView.do?wrtSn=13254501&amp;filePath=L2Rpc2sxL25ld2RhdGEvMjAyMC8yMS9DTFMxMDAwMi8xMzI1NDUwMV9XUlRfMjAyMDAyMDhfMQ==&amp;thumbAt=Y&amp;thumbSe=b_tbumb&amp;wrtTy=10002"
          alt="전자시계 알람"
          class="thumb"
        />

        <div class="text">
          <div class="title">전자시계 알람</div>
          <div class="details">
            by <a href="http://uci.or.kr/G905-13254501">김용배</a> —
            <a href="https://gongu.copyright.or.kr/gongu/main/main.do"
              >공유마당 저작권 위원회</a
            >
          </div>
        </div>
      </div>
    </footer>
    <script src="./js/shared/zoom.js"></script>
    <script src="./js/shared/nav.js"></script>
    <script>
      $(document).foundation();
    </script>
    <script src="./js/shared/fullscreen.button.js"></script>
    <script src="./js/alarm.js"></script>
  </body>
</html>
